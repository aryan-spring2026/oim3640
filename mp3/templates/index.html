<!DOCTYPE html>
<html>
<head>
    <title>Boston Sports Transit Finder</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="hero">
        <div class="container">
            <h1>Boston Sports Transit Finder</h1>

            <p class="subtitle">
                Find nearby Boston-area sports venues and the closest MBTA stop
                to help plan your trip by public transportation.
            </p>

            {% if error %}
                <p class="error">Error: {{ error }}</p>
            {% endif %}

            <form action="/results" method="POST">
                <label for="place_name">Enter an address, neighborhood, or landmark</label>

                <input
                    type="text"
                    id="place_name"
                    name="place_name"
                    placeholder="Example: Boston Common"
                    required
                >

                <button type="submit">Find My Sports Transit Option</button>
            </form>
        </div>
    </div>
</body>
</html>
